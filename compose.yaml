services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: jobbely
      POSTGRES_PASSWORD: jobbely
      POSTGRES_DB: jobbely
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobbely"]
      interval: 5s
      retries: 10
volumes:
  postgres-data:
