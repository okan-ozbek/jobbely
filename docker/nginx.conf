server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2m;
    server_tokens off;
    # Resolve Docker service addresses again after containers are recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Private API payloads and URL parameters never enter proxy access logs.
    location /api/ {
        access_log off;
        set $api_backend api:3001;
        proxy_pass http://$api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Both HEAD preflight and GET must carry the local parser's isolation policy.
    location ~ ^/assets/document-parser-[^/]+\.js$ {
        access_log off;
        add_header Content-Security-Policy "default-src 'none'; script-src 'none'; connect-src 'none'; worker-src 'none'" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri /index.html;
    }
}
